{% extends "base_generic.html" %}

{% block content %}
<div class="form-card card">
  <div class="card-body">
    <h1 class="page-title">Renew: {{book_instance.book.title}}</h1>
    <dl class="detail-list">
      <dt>Borrower</dt><dd>{{book_instance.borrower}}</dd>
      <dt>Due date</dt><dd{% if book_instance.is_overdue %} class="text-danger"{% endif %}>{{book_instance.due_back}}{% if book_instance.is_overdue %} (overdue){% endif %}</dd>
    </dl>
    <form action="" method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
</div>
{% endblock %}
