{% extends "base_generic.html" %}

{% block content %}
<h1 class="page-title">Genre List</h1>

{% if genre_list %}
<div class="card">
  <ul class="list-group list-group-flush">
    {% for item in genre_list %}
    <li class="list-group-item"><a href="{{ item.get_absolute_url }}">{{ item }}</a></li>
    {% endfor %}
  </ul>
</div>
{% else %}
  <div class="empty-state card"><div class="card-body"><p class="empty-title">No genres available</p></div></div>
{% endif %}
{% endblock %}
